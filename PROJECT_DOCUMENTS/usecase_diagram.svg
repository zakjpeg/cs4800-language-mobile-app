<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000">
  <!-- Title -->
  <text x="700" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    LinguaFlow (Parakeet) - Use Case Diagram
  </text>
  
  <!-- System Boundary -->
  <rect x="250" y="80" width="900" height="820" fill="none" stroke="#3498db" stroke-width="3" rx="10"/>
  <text x="700" y="110" font-size="18" font-weight="bold" text-anchor="middle" fill="#3498db">
    LinguaFlow Platform
  </text>
  
  <!-- PRIMARY ACTORS -->
  
  <!-- Individual Learner -->
  <g id="individual-learner">
    <ellipse cx="120" cy="250" rx="80" ry="40" fill="#e8f4f8" stroke="#2980b9" stroke-width="2"/>
    <text x="120" y="245" font-size="13" font-weight="bold" text-anchor="middle">Individual</text>
    <text x="120" y="260" font-size="13" font-weight="bold" text-anchor="middle">Learner</text>
  </g>
  
  <!-- Corporate Admin -->
  <g id="corporate-admin">
    <ellipse cx="120" cy="450" rx="80" ry="40" fill="#fef5e7" stroke="#f39c12" stroke-width="2"/>
    <text x="120" y="445" font-size="13" font-weight="bold" text-anchor="middle">Corporate</text>
    <text x="120" y="460" font-size="13" font-weight="bold" text-anchor="middle">Administrator</text>
  </g>
  
  <!-- Enterprise Learner -->
  <g id="enterprise-learner">
    <ellipse cx="120" cy="650" rx="80" ry="40" fill="#e8f8f5" stroke="#16a085" stroke-width="2"/>
    <text x="120" y="645" font-size="13" font-weight="bold" text-anchor="middle">Enterprise</text>
    <text x="120" y="660" font-size="13" font-weight="bold" text-anchor="middle">Learner</text>
  </g>
  
  <!-- SECONDARY ACTORS -->
  
  <!-- AI Engine -->
  <g id="ai-engine">
    <ellipse cx="1280" cy="200" rx="80" ry="40" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2"/>
    <text x="1280" y="195" font-size="12" font-weight="bold" text-anchor="middle">AI Conversation</text>
    <text x="1280" y="210" font-size="12" font-weight="bold" text-anchor="middle">Engine</text>
  </g>
  
  <!-- Language Coach -->
  <g id="language-coach">
    <ellipse cx="1280" cy="350" rx="80" ry="40" fill="#fdeaea" stroke="#e74c3c" stroke-width="2"/>
    <text x="1280" y="345" font-size="12" font-weight="bold" text-anchor="middle">Language</text>
    <text x="1280" y="360" font-size="12" font-weight="bold" text-anchor="middle">Coach</text>
  </g>
  
  <!-- Educational Institution -->
  <g id="edu-institution">
    <ellipse cx="1280" cy="500" rx="80" ry="40" fill="#ebf5fb" stroke="#3498db" stroke-width="2"/>
    <text x="1280" y="495" font-size="11" font-weight="bold" text-anchor="middle">Educational</text>
    <text x="1280" y="510" font-size="11" font-weight="bold" text-anchor="middle">Institution</text>
  </g>
  
  <!-- Employer Partner -->
  <g id="employer-partner">
    <ellipse cx="1280" cy="650" rx="80" ry="40" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
    <text x="1280" y="645" font-size="12" font-weight="bold" text-anchor="middle">Employer</text>
    <text x="1280" y="660" font-size="12" font-weight="bold" text-anchor="middle">Partner</text>
  </g>
  
  <!-- System Admin -->
  <g id="system-admin">
    <ellipse cx="1280" cy="800" rx="80" ry="40" fill="#fef9e7" stroke="#f1c40f" stroke-width="2"/>
    <text x="1280" y="795" font-size="12" font-weight="bold" text-anchor="middle">System</text>
    <text x="1280" y="810" font-size="12" font-weight="bold" text-anchor="middle">Administrator</text>
  </g>
  
  <!-- USE CASES -->
  
  <!-- Core Learning Use Cases -->
  <ellipse cx="400" cy="180" rx="100" ry="30" fill="#fff9e6" stroke="#34495e" stroke-width="1.5"/>
  <text x="400" y="185" font-size="11" text-anchor="middle">Register & Create Profile</text>
  
  <ellipse cx="550" cy="220" rx="100" ry="30" fill="#fff9e6" stroke="#34495e" stroke-width="1.5"/>
  <text x="550" y="225" font-size="11" text-anchor="middle">Engage in AI</text>
  <text x="550" y="238" font-size="11" text-anchor="middle">Conversation</text>
  
  <ellipse cx="400" cy="280" rx="100" ry="30" fill="#fff9e6" stroke="#34495e" stroke-width="1.5"/>
  <text x="400" y="285" font-size="11" text-anchor="middle">Complete Adaptive</text>
  <text x="400" y="298" font-size="11" text-anchor="middle">Lessons</text>
  
  <ellipse cx="700" cy="240" rx="90" ry="30" fill="#fff9e6" stroke="#34495e" stroke-width="1.5"/>
  <text x="700" y="248" font-size="11" text-anchor="middle">Track Progress</text>
  
  <ellipse cx="850" cy="200" rx="90" ry="30" fill="#fff9e6" stroke="#34495e" stroke-width="1.5"/>
  <text x="850" y="208" font-size="11" text-anchor="middle">Earn Achievements</text>
  
  <!-- Subscription Use Cases -->
  <ellipse cx="550" cy="360" rx="100" ry="30" fill="#e8f6f3" stroke="#34495e" stroke-width="1.5"/>
  <text x="550" y="368" font-size="11" text-anchor="middle">Manage Subscription</text>
  
  <ellipse cx="700" cy="320" rx="90" ry="30" fill="#e8f6f3" stroke="#34495e" stroke-width="1.5"/>
  <text x="700" y="328" font-size="11" text-anchor="middle">Purchase Premium</text>
  
  <ellipse cx="400" cy="380" rx="90" ry="30" fill="#e8f6f3" stroke="#34495e" stroke-width="1.5"/>
  <text x="400" y="388" font-size="11" text-anchor="middle">Refer Friends</text>
  
  <ellipse cx="850" cy="300" rx="90" ry="30" fill="#e8f6f3" stroke="#34495e" stroke-width="1.5"/>
  <text x="850" y="308" font-size="11" text-anchor="middle">Book Live Coaching</text>
  
  <!-- Corporate Use Cases -->
  <ellipse cx="450" cy="500" rx="110" ry="30" fill="#fff3e0" stroke="#34495e" stroke-width="1.5"/>
  <text x="450" y="508" font-size="11" text-anchor="middle">Setup Corporate Account</text>
  
  <ellipse cx="650" cy="480" rx="100" ry="30" fill="#fff3e0" stroke="#34495e" stroke-width="1.5"/>
  <text x="650" y="488" font-size="11" text-anchor="middle">Manage Employees</text>
  
  <ellipse cx="800" cy="450" rx="110" ry="30" fill="#fff3e0" stroke="#34495e" stroke-width="1.5"/>
  <text x="800" y="458" font-size="11" text-anchor="middle">Configure Learning Programs</text>
  
  <ellipse cx="550" cy="550" rx="90" ry="30" fill="#fff3e0" stroke="#34495e" stroke-width="1.5"/>
  <text x="550" y="558" font-size="11" text-anchor="middle">Generate Reports</text>
  
  <!-- Credential Use Cases -->
  <ellipse cx="600" cy="650" rx="90" ry="30" fill="#fce4ec" stroke="#34495e" stroke-width="1.5"/>
  <text x="600" y="658" font-size="11" text-anchor="middle">Earn Credentials</text>
  
  <ellipse cx="800" cy="600" rx="90" ry="30" fill="#fce4ec" stroke="#34495e" stroke-width="1.5"/>
  <text x="800" y="608" font-size="11" text-anchor="middle">Verify Credentials</text>
  
  <ellipse cx="950" cy="650" rx="90" ry="30" fill="#fce4ec" stroke="#34495e" stroke-width="1.5"/>
  <text x="950" y="658" font-size="11" text-anchor="middle">Share with Employers</text>
  
  <!-- Admin Use Cases -->
  <ellipse cx="500" cy="780" rx="100" ry="30" fill="#f0f0f0" stroke="#34495e" stroke-width="1.5"/>
  <text x="500" y="788" font-size="11" text-anchor="middle">Monitor Performance</text>
  
  <ellipse cx="700" cy="760" rx="90" ry="30" fill="#f0f0f0" stroke="#34495e" stroke-width="1.5"/>
  <text x="700" y="768" font-size="11" text-anchor="middle">Manage Content</text>
  
  <ellipse cx="900" cy="780" rx="90" ry="30" fill="#f0f0f0" stroke="#34495e" stroke-width="1.5"/>
  <text x="900" y="788" font-size="11" text-anchor="middle">Configure AI Models</text>
  
  <!-- CONNECTIONS - Individual Learner -->
  <line x1="200" y1="250" x2="300" y2="180" stroke="#2980b9" stroke-width="1.5"/>
  <line x1="200" y1="250" x2="450" y2="220" stroke="#2980b9" stroke-width="1.5"/>
  <line x1="200" y1="250" x2="300" y2="280" stroke="#2980b9" stroke-width="1.5"/>
  <line x1="200" y1="250" x2="600" y2="240" stroke="#2980b9" stroke-width="1.5"/>
  <line x1="200" y1="250" x2="750" y2="200" stroke="#2980b9" stroke-width="1.5"/>
  <line x1="200" y1="260" x2="450" y2="360" stroke="#2980b9" stroke-width="1.5"/>
  <line x1="200" y1="265" x2="310" y2="380" stroke="#2980b9" stroke-width="1.5"/>
  <line x1="200" y1="255" x2="600" y2="320" stroke="#2980b9" stroke-width="1.5"/>
  <line x1="200" y1="255" x2="750" y2="300" stroke="#2980b9" stroke-width="1.5"/>
  
  <!-- CONNECTIONS - Corporate Admin -->
  <line x1="200" y1="450" x2="340" y2="500" stroke="#f39c12" stroke-width="1.5"/>
  <line x1="200" y1="450" x2="550" y2="480" stroke="#f39c12" stroke-width="1.5"/>
  <line x1="200" y1="450" x2="690" y2="450" stroke="#f39c12" stroke-width="1.5"/>
  <line x1="200" y1="455" x2="460" y2="550" stroke="#f39c12" stroke-width="1.5"/>
  
  <!-- CONNECTIONS - Enterprise Learner -->
  <line x1="200" y1="650" x2="510" y2="650" stroke="#16a085" stroke-width="1.5"/>
  <line x1="200" y1="645" x2="700" y2="600" stroke="#16a085" stroke-width="1.5"/>
  
  <!-- CONNECTIONS - Secondary Actors -->
  <!-- AI Engine -->
  <line x1="1180" y1="200" x2="650" y2="220" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="1180" y1="205" x2="500" y2="280" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="5,5"/>
  
  <!-- Language Coach -->
  <line x1="1180" y1="350" x2="940" y2="300" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,5"/>
  
  <!-- Educational Institution -->
  <line x1="1180" y1="500" x2="890" y2="600" stroke="#3498db" stroke-width="1.5" stroke-dasharray="5,5"/>
  
  <!-- Employer Partner -->
  <line x1="1180" y1="650" x2="1040" y2="650" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,5"/>
  
  <!-- System Admin -->
  <line x1="1180" y1="800" x2="600" y2="780" stroke="#f1c40f" stroke-width="1.5"/>
  <line x1="1180" y1="795" x2="790" y2="760" stroke="#f1c40f" stroke-width="1.5"/>
  <line x1="1180" y1="795" x2="990" y2="780" stroke="#f1c40f" stroke-width="1.5"/>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="270" y="920" width="300" height="60" fill="white" stroke="#95a5a6" stroke-width="1" rx="5"/>
    <text x="280" y="940" font-size="12" font-weight="bold">Legend:</text>
    <line x1="280" y1="950" x2="320" y2="950" stroke="#2980b9" stroke-width="2"/>
    <text x="325" y="954" font-size="10">Primary Actor → Use Case</text>
    <line x1="280" y1="967" x2="320" y2="967" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="325" y="971" font-size="10">Secondary Actor ⟷ Use Case</text>
  </g>
  
  <!-- Color Legend for Actor Types -->
  <g id="actor-legend">
    <rect x="850" y="920" width="280" height="60" fill="white" stroke="#95a5a6" stroke-width="1" rx="5"/>
    <text x="860" y="940" font-size="12" font-weight="bold">Actor Types:</text>
    <circle cx="870" cy="955" r="6" fill="#e8f4f8" stroke="#2980b9" stroke-width="1"/>
    <text x="880" y="959" font-size="10">Primary Actors</text>
    <circle cx="985" cy="955" r="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1"/>
    <text x="995" y="959" font-size="10">Secondary Actors</text>
  </g>
</svg>
